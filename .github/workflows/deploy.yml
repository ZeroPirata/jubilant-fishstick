name: Deploy

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Só o que precisa do servidor roda nele (um notebook): conferir a versão contra a
  # que está no ar. Testes e build da imagem rodam nos runners do GitHub, e o servidor
  # só baixa a imagem pronta: deploy sem compilar nem esquentar a máquina.
  version:
    name: Check version
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4.2.2

      # Todo deploy precisa de versão nova no version.json: maior que a do ar e com data
      # igual ou posterior à dela (cmd/checkversion). A versão no ar é o version.json da
      # pasta do deploy.
      - name: Check version
        run: |
          GO_VERSION=$(grep '^go ' go.mod | awk '{print $2}')
          LIVE=/opt/jubilant-fishstick/version.json
          MOUNT=""
          [ -f "$LIVE" ] && MOUNT="-v $LIVE:/live/version.json:ro"
          docker run --rm --cpus=1 \
            -v "$(pwd):/app" $MOUNT \
            -v jubilant-ci-gomod:/go/pkg/mod \
            -v jubilant-ci-gocache:/root/.cache/go-build \
            -w /app \
            "golang:${GO_VERSION}-alpine" \
            nice -n 19 go run ./cmd/checkversion /live/version.json

  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.4.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./... -count=1 -timeout 120s

      # Passo separado: com -race a compilação é bem mais lenta, e a falha aqui
      # aponta direto para condição de corrida, não para teste quebrado.
      - name: Race detector
        run: go test ./... -race -count=1 -timeout 900s

  image:
    name: Build image
    runs-on: ubuntu-24.04
    needs: [version, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: docker/setup-buildx-action@v3.10.0

      - uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag pelo commit: o deploy sobe exatamente a imagem testada. O cache do
      # GitHub Actions guarda as camadas pesadas (apk, pip) entre execuções.
      - uses: docker/build-push-action@v6.15.0
        with:
          context: .
          push: true
          tags: ghcr.io/zeropirata/jubilant-fishstick:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    runs-on: self-hosted
    needs: image
    permissions:
      contents: read
      packages: read
    env:
      APP_IMAGE: ghcr.io/zeropirata/jubilant-fishstick:${{ github.sha }}

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Cleanup legacy processes
        run: |
          # Mata processos antigos se estiverem rodando fora do docker
          pkill -f "./app" || true
          pkill -f "gerar_pdf.py" || true

      - name: Sync files to /opt
        run: |
          rsync -av --delete \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'data/' \
            ./ /opt/jubilant-fishstick/

      # As migrations rodam sozinhas quando o app sobe (goose em cmd/server/main.go).
      # O backup garante um ponto de retorno caso alguma delas altere dados de forma errada.
      - name: Backup database
        working-directory: /opt/jubilant-fishstick
        run: |
          set -eo pipefail
          if [ -z "$(docker compose ps -q --status running db)" ]; then
            echo "db não está rodando, pulando backup (primeiro deploy?)"
            exit 0
          fi
          BACKUP_DIR="$HOME/db-backups/jubilant-fishstick"
          mkdir -p "$BACKUP_DIR"
          FILE="$BACKUP_DIR/$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}.sql.gz"
          docker compose exec -T db sh -c 'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"' | gzip > "$FILE"
          echo "✅ Backup salvo em $FILE ($(du -h "$FILE" | cut -f1))"
          # Mantém só os 10 backups mais recentes
          ls -1t "$BACKUP_DIR"/*.sql.gz | tail -n +11 | xargs -r rm --

      # Baixa a imagem construída no GitHub (sem compilar aqui) e recria o app. As
      # imagens antigas do app são apagadas do servidor (continuam no GHCR).
      - name: Pull image and restart containers
        working-directory: /opt/jubilant-fishstick
        run: |
          set -e
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker compose pull app
          docker compose up -d --no-build --remove-orphans
          docker logout ghcr.io
          docker images ghcr.io/zeropirata/jubilant-fishstick --format '{{.Repository}}:{{.Tag}}' \
            | grep -v ":${{ github.sha }}$" | xargs -r docker rmi || true
          docker image prune -f

      - name: Wait for healthcheck
        working-directory: /opt/jubilant-fishstick
        run: |
          echo "Aguardando app ficar saudável..."
          for i in $(seq 1 20); do
            STATUS=$(docker compose ps --format json app 2>/dev/null | grep -o '"Health":"[^"]*"' | cut -d'"' -f4)
            if [ "$STATUS" = "healthy" ]; then
              echo "✅ App saudável após ${i} tentativas"
              exit 0
            fi
            echo "  tentativa $i/20 — status: ${STATUS:-starting}"
            sleep 3
          done
          echo "❌ App não ficou saudável em 60s"
          docker compose logs app --tail=30
          exit 1

      # /healthz confere o Postgres e o Redis de verdade, sem tocar em login (o teste
      # antigo, com conta inexistente, gerava erro no log e evento de segurança falso).
      - name: Smoke test
        run: |
          BODY=$(curl -s -w "\n%{http_code}" http://127.0.0.1:8080/healthz)
          CODE=$(echo "$BODY" | tail -n1)
          if [ "$CODE" = "200" ]; then
            echo "✅ Smoke test passou: $(echo "$BODY" | head -n1)"
          else
            echo "❌ Smoke test falhou — HTTP $CODE: $(echo "$BODY" | head -n1)"
            exit 1
          fi
